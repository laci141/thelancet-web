# Render Blueprint. Render builds the Docker image, which COPIES the pre-built
# mirror DB (data.db, ~117 MB) shipped via Git LFS — a full Lancet-family history
# (35k works, 2005-2026) so the UI shows real growth% instead of "New" badges.
# No build-time refresh, no OpenAlex network needed at build.
# The repo must include the committed bin/thelancet-pp-cli-linux (regenerate with
# ./vendor-cli.sh) and the LFS-tracked data.db. Keyless: no secrets, no LLM.
services:
  - type: web
    name: thelancet-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars: []
